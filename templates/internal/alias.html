<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirect</title>
  <link rel="canonical" href="{{ url | safe }}">
  {# Keep the #fragment, which a meta refresh would drop #}
  <script>window.location.replace("{{ url | safe }}" + window.location.hash);</script>
  {# Outside <noscript> so crawlers read it as a redirect without rendering JS #}
  <meta http-equiv="refresh" content="0; url={{ url | safe }}">
</head>
<body>
  <p><a href="{{ url | safe }}">Click here</a> to be redirected.</p>
</body>
</html>
